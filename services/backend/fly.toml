# Fly.io config for the backend. Secrets (keys, World ID) are set with `fly secrets`, never here.
app = "invoice-agent-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DB_PATH = "/data/agentinvoice.db"
  APP_URL = "https://invoice-agent-zeta.vercel.app"
  WORLD_REDIRECT_URI = "https://invoice-agent-api.fly.dev/api/world/callback"

# SQLite lives on a persistent volume so invoices and names survive restarts.
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # The chain indexer runs inside the server, so keep one machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/invoices"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
